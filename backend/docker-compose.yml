services:
  # 前端服务
  ruoyi-frontend:
    build:
      context: ./ruoyi-fastapi-frontend/${FRONTEND_FRAMEWORK:-vue3}/web
      dockerfile: Dockerfile
    image: ruoyi-frontend:latest
    container_name: ruoyi-frontend
    environment:
      TZ: UTC
    ports:
      - "12580:80"
    volumes:
      - ./ruoyi-fastapi-frontend/${FRONTEND_FRAMEWORK:-vue3}/web/bin/nginx.dockermy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ruoyi-backend-my
    networks:
      - ruoyi-network

  # 后端服务（MySQL版本）
  ruoyi-backend-my:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.my
      args:
        # 上游默认清华源在本机网络 403，改用阿里云镜像（可用环境变量 PIP_INDEX_URL 覆盖）
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        # Dockerfile 默认 3.10：sqlglotc 30.23.0 仅发布 cp311+ 预编译轮，3.10 会退回源码编译且核心不匹配导致启动报错。
        # 改用 3.12（项目 CI 明确使用 3.12）。可用环境变量 PYTHON_VERSION 覆盖。
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
    image: ruoyi-backend-my:latest
    container_name: ruoyi-backend-my
    environment:
      TZ: UTC
      RUOYI_PLUGIN_FRONTEND_FRAMEWORK: ${FRONTEND_FRAMEWORK:-vue3}
    ports:
      - "19099:9099"
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - ruoyi-network

  # MySQL服务
  ruoyi-mysql:
    image: mysql:8.0
    container_name: ruoyi-mysql
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruoyi-fastapi
    ports:
      - "13306:3306"
    volumes:
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi.sql
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  ruoyi-redis:
    image: redis:latest
    container_name: ruoyi-redis
    environment:
      TZ: UTC
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  ruoyi-network:
    name: ruoyi-network
    driver: bridge

# 数据持久化（官方默认无持久化，见 README「Docker Compose部署方式」警告，这里补上避免 down 后丢表）
volumes:
  mysql-data:
  redis-data:
# Alembic 配置（BE-02）：只管理 gin_/wx_ 业务表迁移。
# 基座表（user/role/menu/...）由 core.db.init_db create_all 处理，保持不动。
# sqlalchemy.url 不在此配置：migrations/env.py 运行时从 settings.DATABASE_URL 注入
# （读取 backend/.env，宿主执行需覆盖 DB_HOST=127.0.0.1 DB_PORT=13306）。

[alembic]
script_location = migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

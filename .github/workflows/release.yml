name: Publish images

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write
  actions: write

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish GHCR images
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    outputs:
      image_prefix: ${{ steps.image.outputs.prefix }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Normalize image prefix
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=${REGISTRY}/$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: backend-image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/backend-web:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend-web
          cache-to: type=gha,mode=max,scope=backend-web

      - name: Build and push admin image
        id: admin-image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/admin
          file: ./backend/admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}/backend-admin:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend-admin
          cache-to: type=gha,mode=max,scope=backend-admin

      - name: Publish image references and digests
        env:
          IMAGE_PREFIX: ${{ steps.image.outputs.prefix }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          ADMIN_DIGEST: ${{ steps.admin-image.outputs.digest }}
        run: |
          {
            echo '## Published images'
            echo
            echo "Revision: \`${REVISION}\`"
            echo
            echo "- \`${IMAGE_PREFIX}/backend-web:sha-${REVISION}\`"
            echo "  Digest: \`${BACKEND_DIGEST}\`"
            echo "- \`${IMAGE_PREFIX}/backend-admin:sha-${REVISION}\`"
            echo "  Digest: \`${ADMIN_DIGEST}\`"
            echo
            echo 'Use the SHA tags for deployment.'
          } >> "$GITHUB_STEP_SUMMARY"

  pull-images:
    name: Pull images on server
    needs: publish
    if: ${{ needs.publish.result == 'success' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
      IMAGE_TAG: sha-${{ needs.publish.outputs.head_sha }}
      DEPLOY_PATH: /opt/projects/mattress-ux
    steps:
      - name: Pull images over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ignore_host_key: true
          envs: IMAGE_PREFIX,IMAGE_TAG,DEPLOY_PATH
          script_stop: true
          command_timeout: 15m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            test -f docker-compose.yml
            test -f .env
            docker compose config --quiet
            echo "=== Start pulling admin & web ==="
            docker compose pull admin web
            echo "=== Pull finished ==="
            docker images | grep -E '(backend-web|backend-admin)'

  deploy:
    name: Deploy to ECS
    needs: pull-images
    if: ${{ needs.pull-images.result == 'success' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_PREFIX: ${{ needs.publish.outputs.image_prefix }}
      IMAGE_TAG: sha-${{ needs.publish.outputs.head_sha }}
      DEPLOY_PATH: /opt/projects/mattress-ux
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ignore_host_key: true
          envs: IMAGE_PREFIX,IMAGE_TAG,DEPLOY_PATH
          script_stop: true
          command_timeout: 5m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            echo "=== Start up containers ==="
            docker compose up -d --no-build admin web
            echo "=== Waiting for health check ==="
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error http://127.0.0.1:18080/api/v1/base/health >/dev/null; then
                docker compose ps admin web
                exit 0
              fi
              sleep 5
            done
            docker compose ps -a
            docker compose logs --tail=100 admin web
            exit 1
